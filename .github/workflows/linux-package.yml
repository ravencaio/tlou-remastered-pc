# The Linux package of a release.
#
# The maintainer publishes each release from Windows (tools/publish_release.py, with the Windows
# package). Publishing it starts this workflow, which builds the Linux runtime in an Arch Linux
# container at the release's tag, packages it (tools/package_linux.sh) and attaches
# TLOU-Remastered-linux.zip to the same release: the name launcher/updater.py looks for on Linux.
#
# Run it by hand (Actions > Linux package > Run workflow) to rebuild a release's package: it
# then replaces the asset that is already there. A push to the branch linux-package-test builds
# the package of that commit and keeps it as the run's artifact, attached to no release.
name: Linux package

on:
  release:
    types: [published]
  push:
    branches: [linux-package-test]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (v0.6.0, ...)"
        required: true

permissions:
  contents: write   # attach the asset to the release

concurrency:
  group: linux-package-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
      ASSET: dist/TLOU-Remastered-linux.zip
    steps:
      - name: Build tools and libraries (README, Building > Linux)
        run: |
          # No ffmpeg package: the package ships a small FFmpeg of its own (tools/build_ffmpeg_min.sh).
          pacman -Syu --noconfirm --needed git cmake ninja pkgconf python zip unzip github-cli patchelf nasm \
            vulkan-headers vulkan-icd-loader \
            sdl3 fmt boost robin-map xxhash libx11 zydis glslang
          # Arch has no package of the Vulkan Memory Allocator: its single header, at a release tag.
          mkdir -p /usr/local/include/vma
          curl -fsSL --retry 3 -o /usr/local/include/vma/vk_mem_alloc.h \
            https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.3.0/include/vk_mem_alloc.h

      - name: Check out the release's tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 1

      - name: Build a small FFmpeg to ship
        run: |
          # The FFmpeg release Arch currently packages: the port builds against its API.
          # "Version : 2:9.0-1" -> 9.0 (no epoch, no package release).
          version=$(pacman -Si ffmpeg | sed -n 's/^Version *: *//p' | head -1 | sed 's/^[0-9]*://; s/-[^-]*$//')
          echo "FFmpeg $version"
          bash tools/build_ffmpeg_min.sh "$version" /opt/ffmpeg-min

      - name: Build the runtime
        env:
          PKG_CONFIG_PATH: /opt/ffmpeg-min/lib/pkgconfig
          GOW3_PORTABLE: "1"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The GPU library compiles by absolute path: keep the runner's path out of the asserts.
          export CFLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=." CXXFLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=."
          bash gow3_pc/build.sh
          ls -la gow3_pc/out/gow3-probe

      - name: Package
        env:
          PKG_CONFIG_PATH: /opt/ffmpeg-min/lib/pkgconfig
        shell: bash
        run: |
          # On failure the log's end becomes the run's annotation (readable without signing in).
          set -o pipefail
          if ! bash tools/package_linux.sh --no-build 2>&1 | tee package.log; then
            echo "::error title=Package::$(tail -40 package.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Check the package against the updater
        run: |
          python3 - "$ASSET" <<'EOF'
          import sys, zipfile
          sys.path.insert(0, "launcher")
          import updater
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = set(z.namelist())
          # A package may hold its files at the top or inside one folder.
          tops = {n.split("/", 1)[0] + "/" for n in names if "/" in n}
          prefixes = [""] + (list(tops) if len(tops) == 1 else [])
          found = {r: next((p + r for p in prefixes if p + r in names), None) for r in updater.REQUIRED}
          missing = [r for r, name in found.items() if name is None]
          if missing:
              sys.exit("missing from the package: " + ", ".join(missing))
          # The updater restores each file's mode from the zip: programs must be stored executable.
          with zipfile.ZipFile(sys.argv[1]) as z:
              not_exec = [r for r in ("TLOU-Launcher", "TLOU-Game", "python/bin/python3", "gow3_pc/out/gow3-probe")
                          if not (z.getinfo(found[r]).external_attr >> 16) & 0o100]
          if not_exec:
              sys.exit("not stored executable in the zip: " + ", ".join(not_exec))
          print(len(names), "files; every path the updater requires is there")
          EOF
          version=$(cat tools/VERSION)
          [ "${{ github.event_name }}" = push ] || [ "v$version" = "$TAG" ] || \
            echo "::warning::tools/VERSION is $version, the tag is $TAG"

      - name: Smoke test the packaged launcher and Python
        shell: bash
        run: |
          # On failure the log's end becomes the run's annotation (readable without signing in).
          cat > "$RUNNER_TEMP/smoke.sh" <<'SMOKE'
          set -e
          cd dist/TLOU-Remastered-linux
          python/bin/python3 -c "import tkinter, PIL, ssl, sqlite3; print('python', tkinter.TkVersion, PIL.__version__)"
          PYTHONPATH=gow3_pc/out/pydeps python/bin/python3 -c "import iced_x86; print('iced_x86 ok')"
          python/bin/python3 tools/run_game.py --help > /dev/null && echo "run_game.py ok"
          # With every library the package ships removed from the system (as on a Steam Deck,
          # which has few of Arch's current ones), the runtime's still resolve, from
          # gow3_pc/out/lib, and so do Python's modules.
          pacman -Rdd --noconfirm sdl3 fmt zydis xxhash vulkan-icd-loader libx11 libxcb libxau libxdmcp
          ldd gow3_pc/out/gow3-probe
          missing=$( { ldd gow3_pc/out/gow3-probe gow3_pc/out/gpu/libgow3gpu.so gow3_pc/out/lib/*.so* \
            python/bin/python3 python/lib/python3.*/lib-dynload/*.so; } 2>&1 | grep -B20 'not found' || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          python/bin/python3 -c "import tkinter, PIL.Image, ssl, sqlite3, ctypes, zlib; print('python modules ok')"
          echo "runtime libraries ok"
          SMOKE
          set -o pipefail
          if ! bash "$RUNNER_TEMP/smoke.sh" 2>&1 | tee smoke.log; then
            echo "::error title=Smoke test::$(tail -40 smoke.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Keep a test build as the run's artifact
        # Also after a failed smoke test: the test build can still be tried by hand.
        if: ${{ !cancelled() && github.event_name == 'push' && hashFiles('dist/TLOU-Remastered-linux.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-Remastered-linux
          path: ${{ env.ASSET }}
          compression-level: 0

      - name: Attach to the release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          replace=""
          [ "${{ github.event_name }}" = workflow_dispatch ] && replace=--clobber
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" $replace
